[project]
name = "prepende-brain-runtime"
version = "0.1.0rc1"
description = "Product-neutral local-first Prepende brain runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tui = ["textual==6.11.0"]
mcp = ["mcp==1.28.1", "uvicorn==0.51.0"]
firestore = ["google-cloud-firestore"]
graphify = ["graphifyy==0.6.1"]

[project.scripts]
prepende-brain = "prepende_brain.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "agents",
  "connectors",
  "interface",
  "kernel",
  "knowledge",
  "memory",
  "models",
  "prepende_brain",
  "prompts",
  "rag",
  "routes",
  "self_improve",
  "services",
  "support",
  "tactics",
  "tui",
  "workspace",
]

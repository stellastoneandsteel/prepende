name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag whose checked assets will be published
        required: true
        default: v0.3.0rc1
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prepende-protocol
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z]+[0-9]+)?$ ]]; then
            echo "refusing malformed release tag"
            exit 1
          fi
      - name: Download published release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist verification
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern SHA256SUMS \
            --dir verification
      - name: Verify exact release artifacts
        run: cd dist && sha256sum --check ../verification/SHA256SUMS
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/

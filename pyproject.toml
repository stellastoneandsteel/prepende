[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prepende-protocol"
version = "0.3.0rc1"
description = "Registered, chained prediction commitments with explicit external trust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Amerio" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
signatures = ["cryptography>=45"]
test = ["build>=1.2", "jsonschema>=4.23"]

[project.scripts]
prepende = "prepende.__main__:main"

[project.urls]
Repository = "https://github.com/stellastoneandsteel/prepende"

[tool.setuptools]
packages = ["prepende"]
